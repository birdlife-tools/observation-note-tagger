[project]
name = "birdlife-ont-core"
version = "0.1.0"
description = "Extract structured data from bird observation notes using LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "BirdLife Tools Community" }]
keywords = ["ebird", "birds", "ornithology", "llm", "data-extraction", "citizen-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
ont = "ont_core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ont_core"]
