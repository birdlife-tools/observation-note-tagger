name: Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Sync pyproject.toml version
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" packages/core/pyproject.toml

      - name: Build package
        if: steps.check_tag.outputs.exists == 'false'
        run: python -m build packages/core

      - name: Create release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## birdlife-ont-core v${{ steps.version.outputs.version }}

            Extract structured data from bird observation notes using LLMs.

            ### Installation

            ```bash
            pip install birdlife-ont-core==${{ steps.version.outputs.version }}
            ```

            ### Features
            - Ingest pipeline for eBird EBD files
            - LLM extraction with OllamaAdapter (local, free)
            - Validation layer (catches hallucinations)
            - Protocol interfaces for custom adapters

            See [README.md](https://github.com/birdlife-tools/observation-note-tagger/blob/main/packages/core/README.md) for usage.
          files: |
            packages/core/dist/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      - name: Publish to PyPI
        if: steps.check_tag.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload packages/core/dist/*

      - name: Update organization README
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ORG_PAT not set, skipping README update"
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"

          # Clone .github repo
          git clone https://x-access-token:${GH_TOKEN}@github.com/birdlife-tools/.github.git org-readme
          cd org-readme

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update version badge for observation-note-tagger in README
          sed -i "s|\[\!\[v[0-9]*\.[0-9]*\.[0-9]*\](https://img.shields.io/badge/observation--note--tagger|\[\!\[v${VERSION}\](https://img.shields.io/badge/observation--note--tagger|g" profile/README.md
          sed -i "s|observation--note--tagger-v[0-9]*\.[0-9]*\.[0-9]*|observation--note--tagger-v${VERSION}|g" profile/README.md
          sed -i "s|observation-note-tagger/releases/tag/v[0-9]*\.[0-9]*\.[0-9]*|observation-note-tagger/releases/tag/v${VERSION}|g" profile/README.md
          sed -i "s|observation--note--tagger-v${VERSION}-yellow|observation--note--tagger-v${VERSION}-green|g" profile/README.md

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to README"
            exit 0
          fi

          # Create branch and PR
          BRANCH="chore/update-ont-v${VERSION}"
          git checkout -b "$BRANCH"
          git add profile/README.md
          git commit -m "Update observation-note-tagger version to v${VERSION}"
          git push origin "$BRANCH"

          # Create PR
          gh pr create \
            --repo birdlife-tools/.github \
            --title "Update observation-note-tagger to v${VERSION}" \
            --body "Automated update from observation-note-tagger release workflow." \
            --head "$BRANCH" \
            --base main

      - name: Notify Matrix
        if: steps.check_tag.outputs.exists == 'false'
        env:
          MATRIX_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
        run: |
          if [ -z "$MATRIX_TOKEN" ]; then
            echo "MATRIX_ACCESS_TOKEN not set, skipping notification"
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"
          ROOM_ID="!ZFk4tbp2YDlMj4fNKZxHvtGhZ9Vudt21JgWP2B0qJoo"

          curl -s -X PUT \
            "https://matrix.org/_matrix/client/v3/rooms/${ROOM_ID}/send/m.room.message/$(date +%s)" \
            -H "Authorization: Bearer ${MATRIX_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "msgtype": "m.notice",
            "body": "birdlife-ont-core v${VERSION} released | PyPI: https://pypi.org/project/birdlife-ont-core/${VERSION}/ | Release: https://github.com/birdlife-tools/observation-note-tagger/releases/tag/v${VERSION}"
          }
          EOF
