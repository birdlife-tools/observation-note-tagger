[project]
name = "observation-note-tagger"
version = "0.1.0"
description = "Extract structured data from bird observation notes using LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
